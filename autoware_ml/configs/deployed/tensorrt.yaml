# @package _global_
# Evaluate the TensorRT engines of a deploy run in place of the modules they were exported from:
#   autoware-ml test --config-name <task> --weights <ckpt> deployed=tensorrt \
#     deployed.engine_dir=<dir with one <graph>.engine per exported graph>
deployed:
  engine_dir: ???
  # Plugin libraries the engines need, e.g. those of autoware_tensorrt_plugins.
  plugin_paths: []

model:
  deployed_graphs:
    _target_: autoware_ml.utils.deployed_graphs.TensorRTGraphs
    engine_dir: ${deployed.engine_dir}
    plugin_paths: ${deployed.plugin_paths}
