# @package _global_
# HGNetV2-B0 of timm. Its ImageNet weights read RGB normalized by the ImageNet statistics,
# which the detector applies inside the network: the deployed graph still takes raw pixels.
# The neck takes the 256, 512 and 1024 channels of the stages at strides 8, 16 and 32 as they
# are, which makes the neck twice as wide as that of YOLOX-S.
model:
  input_channel_order: rgb
  input_mean: [123.675, 116.28, 103.53]
  input_std: [58.395, 57.12, 57.375]

  backbone:
    _target_: autoware_ml.models.common.backbones.hgnetv2.HGNetV2
    variant: b0
    in_channels: 3
    out_indices: [1, 2, 3]
    projection_channels: null
    # Set to ssld_stage2_ft_in1k to start from the ImageNet weights of timm.
    weights: null
  neck:
    in_channels: [256, 512, 1024]
