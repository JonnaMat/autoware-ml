# @package _global_
# CSPNeXt-S, the backbone of RTMDet-S: depth 0.33, width 0.5. Its ImageNet weights read RGB
# normalized by the ImageNet statistics, which the detector applies inside the network: the
# deployed graph still takes raw pixels.
model:
  input_channel_order: rgb
  input_mean: [123.675, 116.28, 103.53]
  input_std: [58.395, 57.12, 57.375]

  backbone:
    _target_: autoware_ml.models.common.backbones.cspnext.CSPNeXt
    deepen_factor: 0.33
    widen_factor: 0.5
    out_indices: [1, 2, 3]
    # Set to cspnext_s_imagenet_600e to start from the ImageNet weights of MMDetection.
    weights: null
  neck:
    in_channels: [128, 256, 512]
