# @package _global_
# CSPDarknet of YOLOX-M: depth 0.67, width 0.75, with the neck and the head of YOLOX-M. Reads
# BGR in [0, 255], as the YOLOX weights do.
model:
  input_channel_order: bgr
  input_mean: null
  input_std: null

  backbone:
    _target_: autoware_ml.models.common.backbones.csp_darknet.CSPDarknet
    deepen_factor: 0.67
    widen_factor: 0.75
    out_indices: [1, 2, 3]
  neck:
    in_channels: [192, 384, 768]
    deepen_factor: 0.67
  head:
    feat_channels: 192
