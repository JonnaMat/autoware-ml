# @package _global_
# ResNet-50 of torchvision. Its ImageNet weights read RGB normalized by the ImageNet statistics,
# which the detector applies inside the network: the deployed graph still takes raw pixels.
# The neck takes the 512, 1024 and 2048 channels of the stages at strides 8, 16 and 32 as they
# are, which makes the neck four times as wide as that of YOLOX-S. The head keeps its width.
model:
  input_channel_order: rgb
  input_mean: [123.675, 116.28, 103.53]
  input_std: [58.395, 57.12, 57.375]

  backbone:
    _target_: autoware_ml.models.common.backbones.resnet.ResNet50MultiScale
    in_channels: 3
    out_indices: [1, 2, 3]
    # Set to IMAGENET1K_V2 or IMAGENET1K_V1 to start from the ImageNet weights of torchvision.
    weights: null
  neck:
    in_channels: [512, 1024, 2048]
