# @package _global_
# The LitePT benchmark leaf on the official FY26H1 delivery (drive-level split) instead of the
# Kognic pre-delivery set; otherwise identical to the pre-delivery benchmark leaf.
defaults:
  - /tasks/multi/ptv3/t4dataset/base_voxel012_122m
  - /tasks/segmentation3d/litept/encoder
  - /tasks/segmentation3d/litept/seg3d_head
  - /database@database: t4dataset/t4dataset_j6gen2_det3d_seg3d_fy26h1
  - override /database/t4dataset/taxonomy@taxonomy: default_coarse
  - override /ego@ego: default_t4dataset
  - _self_

batch_size: 8
num_workers: 8
experiment_group_name: litept_det3d_seg3d/${database.version}/kd_benchmark
experiment_name: litept_voxel012_b8_30e_t4dataset_122m_j6gen2_det3d_seg3d

trainer:
  max_epochs: 30

model:
  scheduler:
    warmup_epochs: 4
    decay_epochs: 26

callbacks:
  dynamic_validation:
    epoch_intervals: [[0, 1]]
